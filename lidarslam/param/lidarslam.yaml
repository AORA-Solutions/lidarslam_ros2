scan_matcher:
  ros__parameters:
    global_frame_id: "map"
    robot_frame_id: "base_link"
    registration_method: "NDT"
    ndt_resolution: 2.0
    ndt_num_threads: 12
    gicp_corr_dist_threshold: 5.0
    trans_for_mapupdate: 2.5
    vg_size_for_input: 0.5
    vg_size_for_map: 0.5
    use_min_max_filter: true
    scan_min_range: 1.0
    scan_max_range: 200.0
    scan_period: 0.1
    map_publish_period: 12.0
    num_targeted_cloud: 12
    set_initial_pose: true
    initial_pose_x: 279.478
    initial_pose_y: -40.009
    initial_pose_z: -21.759
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.976
    initial_pose_qw: 0.219
    use_imu: false
    use_odom: false
    debug_flag: false

graph_based_slam:
    ros__parameters:
      registration_method: "NDT"
      ndt_resolution: 2.0
      ndt_num_threads: 8
      voxel_leaf_size: 0.5
      loop_detection_period: 6000
      threshold_loop_closure_score: 0.7
      distance_loop_closure: 100.0
      range_of_searching_loop_closure: 15.0
      search_submap_num: 1
      num_adjacent_pose_cnstraints: 5
      use_save_map_in_loop: false
      debug_flag: true

